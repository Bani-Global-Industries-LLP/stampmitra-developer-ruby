name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_JOBS: '4'
  BUNDLE_RETRY: '3'

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        include:
          # Alternative implementations: informational, they do not block the build.
          - ruby: jruby
            experimental: true
          - ruby: truffleruby
            experimental: true
    env:
      BUNDLE_WITHOUT: lint:docs:audit
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install gems
        run: bundle install
      - name: Unit tests
        run: bundle exec rake test
      - name: Every spec operation has an SDK method
        run: ruby scripts/check-spec-coverage
      - name: Generated models are up to date
        run: ruby scripts/generate-models --check

  lint:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: docs:audit
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install gems
        run: bundle install
      - run: bundle exec rubocop

  docs:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: lint:audit
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install gems
        run: bundle install
      - name: YARD builds without warnings
        run: bundle exec yard doc --no-save --no-cache --quiet --fail-on-warning
      - name: Every public API item is documented
        run: |
          stats="$(bundle exec yard stats --list-undoc --no-save --no-cache)"
          echo "$stats"
          echo "$stats" | grep -q '100.00% documented'

  audit:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: test:lint:docs
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install gems
        run: bundle install
      - name: Audit dependencies and advisories (Gemfile.lock resolved by the install above)
        run: bundle exec bundle-audit check --update

  conformance:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: lint:docs:audit
      STAMPMITRA_SPEC_DIR: ${{ github.workspace }}/.openapi
      CONFORMANCE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Bani-Global-Industries-LLP/stampmitra-developer-openapi
          path: .openapi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install gems
        run: bundle install
      - name: Conformance suite against the spec repo mock server
        run: bundle exec rake test:conformance
      - name: README snippets compile and run
        run: ruby scripts/check-readme-snippets
      - name: Install example gems
        run: bundle install --gemfile examples/Gemfile
      - name: Examples run against the mock (plain scripts, Sinatra and Rack receivers)
        run: ruby scripts/run-examples
      - name: Built gem installs into a clean GEM_HOME and works
        run: ruby scripts/verify-built-gem

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint (with shellcheck)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
