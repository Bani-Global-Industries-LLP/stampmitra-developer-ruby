plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'doc/**/*'
    - 'tmp/**/*'
    - 'pkg/**/*'
    - 'lib/stampmitra/models.rb' # generated by scripts/generate-models

Layout/LineLength:
  Max: 150
  Exclude: ['test/**/*', 'scripts/*', 'examples/*']

# Library code keeps to sensible metrics; tests and scripts favour readable, dense scenarios.
Metrics/MethodLength:
  Max: 25
  Exclude: ['test/**/*', 'scripts/*']

Metrics/AbcSize:
  Max: 30
  Exclude: ['test/**/*', 'scripts/*']

Metrics/CyclomaticComplexity:
  Max: 12
  Exclude: ['test/**/*', 'scripts/*']

Metrics/PerceivedComplexity:
  Max: 12
  Exclude: ['test/**/*', 'scripts/*']

Metrics/ClassLength:
  Max: 300
  Exclude: ['test/**/*']

Metrics/ModuleLength:
  Max: 300

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'Rakefile'
    - '*.gemspec'

Metrics/ParameterLists:
  CountKeywordArgs: false

Style/Documentation:
  Enabled: false # YARD enforces documentation (yard stats --list-undoc)

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/RaiseArgs:
  Enabled: false # raise Klass.new(msg, code: ...) is the idiom for errors with keyword details

Style/Semicolon:
  Exclude: ['test/**/*']

Lint/AmbiguousBlockAssociation:
  Exclude: ['test/**/*']

Minitest/EmptyLineBeforeAssertionMethods:
  Enabled: false

Minitest/MultipleAssertions:
  Enabled: false # scenario tests assert several facts about one interaction

Minitest/AssertionInLifecycleHook:
  Enabled: false
